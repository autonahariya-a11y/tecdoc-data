name: Update TecDoc Data

on:
  # Run weekly on Sunday at 3:00 AM Israel time (00:00 UTC)
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_refetch:
        description: 'Ignore 7-day cache and refetch all articles'
        type: boolean
        default: false
      only_missing:
        description: 'Only fetch SKUs that are missing entirely (skip any existing file)'
        type: boolean
        default: false
      skip_sitemap_scan:
        description: 'Skip the sitemap scan step (use existing articles.txt as-is)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max for large catalogs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan site for spare-part SKUs (adds missing ones to articles.txt)
        if: inputs.skip_sitemap_scan != true
        run: |
          node scripts/scan-sitemap.js || echo "Sitemap scan failed but continuing"
          # Merge any newly-found live SKUs into articles.txt
          if [ -f data/live-skus.txt ]; then
            # Extract non-comment lines from live-skus.txt
            grep -v '^#' data/live-skus.txt | grep -v '^$' > /tmp/live_skus.txt || true
            # Concatenate with existing articles.txt, dedupe
            cat data/articles.txt /tmp/live_skus.txt 2>/dev/null | \
              grep -v '^#' | grep -v '^$' | \
              awk '!seen[$0]++' > /tmp/articles_merged.txt
            # Preserve header
            {
              echo "# TecDoc article numbers to fetch"
              echo "# Auto-merged: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              cat /tmp/articles_merged.txt
            } > data/articles.txt
            echo "articles.txt line count: $(wc -l < data/articles.txt)"
          fi

      - name: Fetch TecDoc data
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FORCE_REFETCH: ${{ inputs.force_refetch == true && '1' || '' }}
          ONLY_MISSING: ${{ inputs.only_missing == true && '1' || '' }}
        run: node scripts/fetch-tecdoc.js

      - name: Commit and push updated data
        run: |
          git config user.name "TecDoc Bot"
          git config user.email "bot@autonahariya.co.il"
          git add data/*.json data/articles.txt data/*.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update TecDoc data — $(date +'%Y-%m-%d')"
          # Retry push with rebase if remote has moved (concurrent commits during long fetch)
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push $i failed, rebasing and retrying..."
            git pull --rebase origin main || { echo "Rebase failed"; exit 1; }
            sleep 2
          done
          echo "Push failed after 5 attempts"
          exit 1
